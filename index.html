<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Raah — Route choices that fit you</title>
    <meta
      name="description"
      content="Compare route time, cost, comfort, weather, and safety-supporting signals with local demo data."
    />
    <meta name="theme-color" content="#ef3025" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@500,600,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/raah-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Raah" />
  </head>
  <body>
    <div id="root">
      <!-- Loading screen: poster-style splash with the commute character,
           replaced by React as soon as the app mounts. -->
      <div
        style="
          min-height: 100vh;
          min-height: 100dvh;
          background: #ef3025;
          font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          color: #202124;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        "
      >
        <svg
          width="190"
          height="264"
          viewBox="250 30 300 440"
          aria-hidden="true"
          style="display: block"
        >
          <g class="sp-bob">
            <g transform="translate(360, 145)">
              <path
                d="M 0,0 C -35,65 -85,155 -125,215 C -95,215 -80,195 -55,200 C -30,205 -15,180 15,175 Z"
                fill="#E5DEC9"
                stroke="#18181B"
                stroke-width="2.5"
                stroke-linejoin="round"
              />
              <path
                d="M -12,35 C -38,95 -65,150 -85,195"
                stroke="#18181B"
                stroke-width="2.5"
                stroke-linecap="round"
                fill="none"
              />
            </g>
            <g transform="translate(425, 255)">
              <rect x="-24" y="-15" width="48" height="190" rx="12" fill="#18181B" />
              <path
                d="M -24,160 L 24,160 L 42,174 C 45,176 43,180 38,180 L -24,180 Z"
                fill="#18181B"
              />
            </g>
            <g transform="translate(353, 255)">
              <rect x="-24" y="-15" width="48" height="190" rx="12" fill="#18181B" />
              <path
                d="M -24,160 L 24,160 L 24,180 L -38,180 C -43,180 -45,176 -42,174 Z"
                fill="#18181B"
              />
            </g>
            <g transform="translate(390, 200)">
              <path
                d="M -62,-62 C -25,-68 30,-64 62,-54 C 72,-50 70,15 62,62 L -60,62 C -68,15 -70,-50 -62,-62 Z"
                fill="#18181B"
              />
              <g transform="translate(-8, -98)">
                <circle cx="-15" cy="-2" r="9.5" fill="#18181B" />
                <rect x="-12" y="-24" width="27" height="45" rx="13.5" fill="#18181B" />
                <path
                  d="M 5,-11 L 8,4 L -1,4"
                  fill="none"
                  stroke="#F8C537"
                  stroke-width="3.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </g>
          </g>
          <line
            x1="270"
            y1="436"
            x2="530"
            y2="436"
            stroke="#1B317E"
            stroke-width="6"
            stroke-linecap="round"
          />
          <g class="sp-dashes" stroke="#18181B" stroke-width="4" stroke-linecap="round">
            <line x1="290" y1="452" x2="330" y2="452" />
            <line x1="380" y1="452" x2="420" y2="452" />
            <line x1="470" y1="452" x2="510" y2="452" />
          </g>
        </svg>
        <div
          style="
            margin-top: 2px;
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            line-height: 1;
            color: #fff9eb;
            text-shadow: 0 4px 0 rgba(32, 33, 36, 0.45);
          "
        >
          Raah
        </div>
        <div style="margin-top: 6px; font-size: 0.95rem; font-weight: 600; color: #ffe3b3">
          Choose the route that fits you.
        </div>
        <div class="sp-track">
          <div class="sp-runner"></div>
        </div>
        <style>
          .sp-bob {
            animation: sp-bob 1.6s ease-in-out infinite;
          }
          @keyframes sp-bob {
            0%,
            100% {
              transform: translateY(0);
            }
            50% {
              transform: translateY(-9px);
            }
          }
          .sp-dashes {
            animation: sp-dashes 0.8s linear infinite;
          }
          @keyframes sp-dashes {
            from {
              transform: translateX(0);
            }
            to {
              transform: translateX(-90px);
            }
          }
          .sp-track {
            margin-top: 22px;
            width: 230px;
            max-width: 70vw;
            height: 16px;
            border: 2.5px solid #18181b;
            background: #fff9eb;
            border-radius: 999px;
            box-shadow: 0 3px 0 #18181b;
            overflow: hidden;
          }
          .sp-runner {
            width: 42%;
            height: 100%;
            background: #ffc52e;
            border-right: 2.5px solid #18181b;
            border-radius: 999px;
            animation: sp-slide 1.15s ease-in-out infinite;
          }
          @keyframes sp-slide {
            0% {
              transform: translateX(-115%);
            }
            100% {
              transform: translateX(285%);
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .sp-bob,
            .sp-dashes,
            .sp-runner {
              animation: none;
            }
          }
        </style>
      </div>
    </div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 32rem; margin: 0 auto">
        <h1>Raah</h1>
        <p>
          Raah is a route-comparison planner. It needs JavaScript enabled to run. All data in Raah
          is synthetic demo data and no network connection is required beyond loading the app.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
