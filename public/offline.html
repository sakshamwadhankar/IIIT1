<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raah — offline</title>
    <meta name="theme-color" content="#283593" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7fb;
        color: #1e293b;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card {
        text-align: center;
        padding: 2.5rem 2rem;
        max-width: 24rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #e8eaf6;
        color: #283593;
        font-weight: 600;
        border-radius: 999px;
        padding: 0.35rem 0.9rem;
        font-size: 0.85rem;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0.25rem 0 0.5rem;
        color: #283593;
      }
      p {
        line-height: 1.5;
        margin: 0.5rem 0;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg
        width="72"
        height="72"
        viewBox="0 0 512 512"
        role="img"
        aria-label="Raah logo"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect x="16" y="16" width="480" height="480" rx="112" fill="#283593" />
        <path
          d="M176 400 L176 150 Q176 118 216 116 Q300 112 312 168 Q322 220 258 234 L192 248 L338 392"
          fill="none"
          stroke="#f6f7fb"
          stroke-width="30"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="356" cy="400" r="34" fill="#5eead4" />
        <circle cx="356" cy="400" r="14" fill="#283593" />
      </svg>
      <div class="badge">Demo data · Offline</div>
      <h1>You’re offline</h1>
      <p>
        Raah could not load this page from the network. The app itself works offline — reopen Raah
        from your home screen or go back to the app.
      </p>
      <p>All route information in Raah is synthetic demo data.</p>
    </main>
  </body>
</html>
